# Validation job for the Vector scraper: emits one line per severity bucket
# from a NON-infra namespace, so results must appear under
#   logs/namespaces/vector-demo/{info,debug,warning,error,metrics}.log
# Run any time with:  kubectl apply -f local-vector/test-job.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: vector-demo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vector-classifier-test
  namespace: vector-demo
  labels:
    app.kubernetes.io/name: vector-classifier-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-classifier-test
    spec:
      restartPolicy: Never
      containers:
        - name: emitter
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo 'INFO: application started successfully'
              echo 'DEBUG: opening database connection pool'
              echo 'WARN: cache miss rate above threshold'
              echo 'ERROR: failed to connect to upstream service'
              echo 'FATAL: unrecoverable panic in worker goroutine'
              echo '{"level":"error","msg":"json-formatted error line"}'
              echo '{"level":"warning","msg":"json-formatted warning line"}'
              echo '{"level":"info","msg":"json-formatted info line"}'
              echo 'level=error msg="logfmt error line" code=500'
              echo 'http_requests_total{method="get"} 1027'
              echo '# HELP go_goroutines Number of goroutines that currently exist.'
              echo 'go_goroutines 42'
              echo 'INFO: all categories emitted; exiting in 120s'
              sleep 120