# Installs the `logscope` command from a source checkout (pip install .).
# Production builds use the PyInstaller binary / container image instead
# (Makefile, Dockerfile); their dependency pins are in requirements.lock.
[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "logscope"
dynamic = ["version"]
description = "Kubernetes log viewer with anomaly insights (Vector -> S3 -> SQLite) and its operator tools"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0", "boto3>=1.28", "cryptography>=42"]

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.scripts]
logscope = "logscope.cli:main"

[tool.setuptools]
packages = ["logscope", "webapp", "webapp.api"]

[tool.setuptools.package-data]
webapp = ["ui/index.html", "ui/app.js", "ui/styles.css"]
"webapp.api" = ["signatures.yaml"]

[tool.setuptools.dynamic]
version = { attr = "logscope.version.__version__" }
