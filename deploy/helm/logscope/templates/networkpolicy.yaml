{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "logscope.fullname" . }}
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "logscope.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
{{- end }}
