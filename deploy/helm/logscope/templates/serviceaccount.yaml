apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logscope.fullname" . }}
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
# No token by default: the Deployment mounts one only for kubectl actions
# (kubectl.enabled + rbac.*) or the vulnerability view (security.vulnerabilityScanning).
automountServiceAccountToken: false
{{- with .Values.image.pullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
