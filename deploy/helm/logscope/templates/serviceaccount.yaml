apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logscope.fullname" . }}
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
# No token by default: only kubectl actions (kubectl.enabled + rbac.*) use the API.
automountServiceAccountToken: false
{{- with .Values.image.pullSecrets }}
imagePullSecrets:
  {{- range . }}
  - name: {{ . }}
  {{- end }}
{{- end }}
