{{- /* Created only from inline values; existingSecret references are used as-is. */ -}}
{{- $webS3 := and (not .Values.s3.credentials.webapp.existingSecret) .Values.s3.credentials.webapp.accessKeyId -}}
{{- $aiInline := and (include "logscope.aiEnabled" .) (not .Values.ai.existingSecret) .Values.ai.apiKey -}}
{{- if or $webS3 $aiInline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logscope.fullname" . }}-credentials
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $webS3 }}
  AWS_ACCESS_KEY_ID: {{ .Values.s3.credentials.webapp.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.credentials.webapp.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if $aiInline }}
  AI_API_KEY: {{ .Values.ai.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.vector.enabled (not .Values.s3.credentials.vector.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logscope.vector.fullname" . }}-credentials
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.vector.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.credentials.vector.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.credentials.vector.secretAccessKey | b64enc | quote }}
{{- end }}
