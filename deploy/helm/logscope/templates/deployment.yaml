{{- include "logscope.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logscope.fullname" . }}
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  # Recreate: two pods must never open the same SQLite file / RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "logscope.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logscope.labels" . | nindent 8 }}
      annotations:
        # Config is read only at startup; roll the pod when it changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Roll the pod when its credential settings change (hash only).
        checksum/credentials: {{ include "logscope.webapp.credentialsChecksum" . }}
    spec:
      serviceAccountName: {{ include "logscope.fullname" . }}
      # Only kubectl actions (kubectl.enabled) need an API token.
      automountServiceAccountToken: {{ include "logscope.kubectlEnabled" . | eq "true" }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          image: {{ include "logscope.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Command and arguments come from the image:
          #   logscope serve --host 0.0.0.0 --port 8000 --config /etc/logscope/config.yaml
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: LOGSCOPE_WEBAPP_DB_PATH
              value: /data/logscope.sqlite
            # Durable state (saved views): its own file on the same PVC, under
            # its own subPath, so wiping the log cache never touches it.
            - name: LOGSCOPE_WEBAPP_STATE_DB_PATH
              value: /state/state.sqlite
            # SQLite spills large sorts and index builds to temp files. Keep them
            # on the PVC: on the /tmp emptyDir (sizeLimit) an index build on a
            # large database could get the pod evicted.
            - name: SQLITE_TMPDIR
              value: /data
            # The HTTP API has no authentication: kubectl actions run only with
            # kubectl.enabled (kubectl image + an explicit RBAC Role).
            - name: LOGSCOPE_ACTIONS_ENABLED
              value: {{ include "logscope.kubectlEnabled" . | eq "true" | quote }}
            - name: LOGSCOPE_LOG_LEVEL
              value: {{ .Values.webapp.logLevel | quote }}
            - name: LOGSCOPE_AI_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.ai.rateLimitPerMinute | int | quote }}
            {{- with .Values.webapp.allowedOrigins }}
            - name: LOGSCOPE_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            # Host names the app answers to (DNS-rebinding guard); IP literals
            # and localhost (kubectl port-forward) are always accepted.
            - name: LOGSCOPE_TRUSTED_HOSTS
              value: {{ include "logscope.trustedHosts" . | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "logscope.webapp.s3Secret" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "logscope.webapp.s3Secret" . }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- if include "logscope.aiEnabled" . }}
            # Same variable for every provider; config.yaml names it in api_key_env.
            - name: LOGSCOPE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "logscope.aiSecret" . }}
                  key: {{ include "logscope.aiSecretKey" . }}
            {{- end }}
            {{- with .Values.settings.adminToken.existingSecret }}
            # Bearer token for the Settings tab (else generated into /state/admin.token).
            - name: LOGSCOPE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.settings.adminToken.existingSecretKey }}
            {{- end }}
            {{- with .Values.settings.secretKey.existingSecret }}
            # Master key for an API key stored from the Settings tab (else /state/secret.key).
            - name: LOGSCOPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.settings.secretKey.existingSecretKey }}
            {{- with $.Values.settings.secretKey.previousKeysKey }}
            - name: LOGSCOPE_SECRET_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.settings.secretKey.existingSecret }}
                  key: {{ . }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.ai.allowedHosts }}
            - name: LOGSCOPE_AI_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.mattermost.enabled }}
            # Webhook URL for anomaly notifications; config.yaml names this variable.
            - name: LOGSCOPE_MATTERMOST_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mattermost.existingSecret | default (printf "%s-credentials" (include "logscope.fullname" .)) }}
                  key: {{ if .Values.mattermost.existingSecret }}{{ .Values.mattermost.existingSecretKey }}{{ else }}MATTERMOST_WEBHOOK_URL{{ end }}
            {{- end }}
            {{- with .Values.webapp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            # Local cache queryable. S3/AI outages surface in /api/status, not here.
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            # Process answers and the ingest loop is running.
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/logscope
              readOnly: true
            - name: data
              mountPath: /data
            - name: data
              mountPath: /state
              subPath: state
            # SQLite (TMPDIR=/tmp in the image) writes temp files here; the
            # root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "logscope.fullname" . }}-config
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "logscope.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
