apiVersion: v1
kind: Service
metadata:
  name: {{ include "logscope.fullname" . }}
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "logscope.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
