{{- /* The web app's config.yaml. No secrets: the AI key and the Mattermost webhook URL arrive via env. */ -}}
{{- $buckets := list -}}
{{- range .Values.logscope.severity.buckets }}{{ $buckets = append $buckets (dict "name" .name) }}{{ end -}}
{{- $ai := dict
  "provider" (lower (toString .Values.ai.provider))
  "model" (toString .Values.ai.model)
  "api_key_env" "LOGSCOPE_AI_API_KEY"
  "base_url" (toString .Values.ai.baseUrl)
  "reasoning_effort" (toString .Values.ai.reasoningEffort)
  "max_anomalies_per_tick" (int .Values.ai.maxAnomaliesPerTick)
  "deep_model" (toString (.Values.ai.deepModel | default ""))
  "prices" (.Values.ai.prices | default dict)
  "features" (.Values.ai.features | default dict)
  "budgets" (.Values.ai.budgets | default dict)
  "cache_ttl_hours" (.Values.ai.cacheTtlHours | default 168)
  "auto_summary_min_urgency" (toString (.Values.ai.autoSummaryMinUrgency | default "urgent"))
  "signatures" (.Values.ai.signatures | default list) -}}
{{- $mm := dict
  "enabled" (and .Values.mattermost.enabled true)
  "webhook_url_env" "LOGSCOPE_MATTERMOST_WEBHOOK_URL"
  "min_urgency" (lower (toString .Values.mattermost.minUrgency))
  "link_base_url" (toString .Values.mattermost.linkBaseUrl)
  "renotify_after_hours" .Values.mattermost.renotifyAfterHours
  "max_age_hours" .Values.mattermost.maxAgeHours -}}
{{- $config := dict
  "sinks" (dict "s3" (dict "bucket" .Values.s3.bucket "region" .Values.s3.region "key_prefix" .Values.s3.keyPrefix "retention_days" (int .Values.s3.retentionDays)))
  "routing" (dict "infra_namespaces" .Values.logscope.routing.infra_namespaces)
  "falco" (dict "enabled" .Values.logscope.falco.enabled "namespace" .Values.logscope.falco.namespace)
  "severity" (dict "buckets" $buckets)
  "webapp" (dict "backend" .Values.webapp.backend "insights" .Values.webapp.insights "ai" $ai "mattermost" $mm) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logscope.fullname" . }}-config
  namespace: {{ include "logscope.namespace" . }}
  labels:
    {{- include "logscope.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
