# Generated by scripts/render.py — do not edit by hand.
# Incremental byte-append backup (shrink → full recopy; else tail-append).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vector-log-backup
  namespace: logging
  labels:
    app.kubernetes.io/name: vector-log-backup
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vector-log-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
          containers:
            - name: backup
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -u
                  SRC=/data/logs
                  DST=/data/backups/current
                  LOGF=/data/backups/backup.log
                  CNT=/tmp/backup.changed          # subshell-safe change counter
                  mkdir -p "$DST"
                  : > "$CNT"

                  find "$SRC" -type f -name '*.log' 2>/dev/null | sort |
                  while read -r src; do
                    rel=${src#"$SRC"/}
                    dst="$DST/$rel"
                    mkdir -p "${dst%/*}"

                    # Skip sources still being written (last byte != newline)
                    last=$(tail -c 1 "$src" | od -An -tu1 | tr -d '[:space:]')
                    [ "$last" = "10" ] || continue

                    s=$(wc -c < "$src")
                    if [ -f "$dst" ]; then d=$(wc -c < "$dst"); else d=0; : > "$dst"; fi

                    if [ "$d" -gt "$s" ]; then
                      cat "$src" > "$dst"                    # source shrank: full resync
                      echo x >> "$CNT"
                    elif [ "$d" -lt "$s" ]; then
                      tail -c +"$((d + 1))" "$src" >> "$dst"  # INCREMENTAL: append new bytes only
                      echo x >> "$CNT"
                    fi
                  done

                  changed=$(wc -l < "$CNT")
                  total=$(find "$DST" -type f -name '*.log' | wc -l)
                  echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') sync ok: $changed file(s) updated, $total file(s) in backup" >> "$LOGF"
              volumeMounts:
                - name: project
                  mountPath: /data
          volumes:
            - name: project
              hostPath:
                path: /var/lib/logscope
                type: Directory
