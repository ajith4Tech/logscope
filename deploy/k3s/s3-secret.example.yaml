# Copy to s3-secret.yaml, fill in real values, kubectl apply -f — never commit the filled version.
# metadata.name must equal sinks.s3.secret_name in config.yaml (default
# vector-s3-creds): the rendered Vector values read the keys from that Secret.
apiVersion: v1
kind: Secret
metadata:
  name: vector-s3-creds
  namespace: logging
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
