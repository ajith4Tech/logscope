## Production values for the official fluent/fluent-bit chart.
## Install: helm upgrade --install fluent-bit fluent/fluent-bit -n kube-system -f helm-values.yaml
## Auth: IRSA annotation below (real ARN printed by ./irsa-setup.sh); see README for non-EKS auth.
## Prereq once (classifier used by the DaemonSet):
##   kubectl -n kube-system create configmap fluent-bit-lua --from-file=classify.lua
##
## NOTE: 'daemonSetVolumes'/'daemonSetVolumeMounts' REPLACE the chart defaults,
## so varlog + machine-id are redeclared here on purpose.

image:
  repository: fluent/fluent-bit
  tag: "5.1.1"                          # pin! never float tags in prod

serviceAccount:
  create: true
  name: fluent-bit-s3
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/fluent-bit-s3-logs  # <- replace

rbac:
  create: true

priorityClassName: system-node-critical  # keep collecting under node pressure

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1                    # roll one node at a time; never blind the whole cluster

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

env:
  - name: AWS_REGION
    value: "ap-south-1"                  # <- set
  - name: S3_BUCKET
    value: "myco-k8s-logs"               # <- set

# Node-local persistence: offsets + fs chunks MUST survive pod restarts/outages
# (camelCase keys REPLACE chart defaults -> varlog & machine-id redeclared)
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File
  - name: flbstate
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate
  - name: luascripts
    configMap:
      name: fluent-bit-lua
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true
  - name: flbstate
    mountPath: /var/lib/fluent-bit
  - name: luascripts
    mountPath: /fluent-bit/etc/lua

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2020"
  prometheus.io/path: /api/v1/metrics/prometheus

config:
  service: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
        storage.path              /var/lib/fluent-bit/storage
        storage.sync              normal
        storage.checksum          Off
        storage.max_chunks_up     256
        storage.backlog.mem_limit 100M

  inputs: |
    [INPUT]
        Name                      tail
        Tag                       kube.*
        Path                      /var/log/containers/*.log
        Exclude_Path              /var/log/containers/*_kube-system_fluent-bit-*.log
        Parser                    cri
        DB                        /var/lib/fluent-bit/flb_containers.db
        Read_from_Head            Off     # prod starts live; flip On ONCE for backfill
        Mem_Buf_Limit             100MB
        storage.type              filesystem
        Skip_Long_Lines           On
        Refresh_Interval          10
        Rotate_Wait               30

  filters: |
    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_URL                  https://kubernetes.default.svc:443
        Kube_CA_File              /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File           /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix           kube.var.log.containers.
        Labels                    On
        Annotations               Off
    [FILTER]
        Name                      parser
        Match                     kube.*
        Key_Name                  message
        Parser                    json
        Reserve_Data              On
        Preserve_Key              Off
    [FILTER]
        Name                      lua
        Match                     kube.*
        script                    /fluent-bit/etc/lua/classify.lua
        call                      classify
        protected_mode            true
    [FILTER]
        Name                      rewrite_tag
        Match                     kube.*
        Rule                      $log_type ^error$     logs.error     FALSE
        Rule                      $log_type ^warning$   logs.warning   FALSE
        Rule                      $log_type ^metrics$   logs.metrics   FALSE
        Rule                      $log_type ^debug$     logs.debug     FALSE
        Rule                      $log_type ^info$      logs.info      FALSE
        Rule                      $log_type .*          logs.info      FALSE
        Emitter_Name              re_emitted_logs
        Emitter_Storage_Type      filesystem   # don't lose re-emitted records under pressure
    [FILTER]
        Name                      modify
        Match                     logs.*
        Remove                    line         # flat text is redundant inside S3 JSON

  outputs: |
    [OUTPUT]
        Name                      s3
        Match                     logs.*
        region                    ${AWS_REGION}
        bucket                    ${S3_BUCKET}
        s3_key_format             /cluster-logs/$TAG/%Y/%m/%d/%H_%M_%S_$UUID.gz
        s3_key_format_tag_delimiters .
        total_file_size           50M
        upload_timeout            10m
        compression               gzip
        store_dir                 /var/lib/fluent-bit/s3
        preserve_data_ordering    On
        storage_class             INTELLIGENT_TIERING
        Retry_Limit               False